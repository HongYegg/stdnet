name: Unzip in repo
on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Unzip
        run: |
          unzip -o stdnet-main.zip -d .
          # 如果不想保留zip，下一行取消注释
          # rm stdnet-main.zip
      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "unzip stdnet-main.zip" || echo "no changes"
          git push
